<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B2440"/>
    <stop offset="1" stop-color="#126B5C"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2440" flood-opacity="0.12"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="#F4F7F6"/>
<rect x="0" y="0" width="1600" height="260" fill="url(#bg)"/>
<circle cx="1450" cy="55" r="170" fill="#67D7A6" opacity="0.08"/>
<circle cx="1450" cy="55" r="110" fill="none" stroke="#67D7A6" stroke-width="2" opacity="0.22"/>
<text x="90" y="105" fill="#FFFFFF" font-size="64" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="-1">GST changes from 1 April 2026</text>
<text x="92" y="160" fill="#DDEFE9" font-size="28" font-family="Segoe UI, Arial, sans-serif">What became operative, what followed later, and what businesses should not apply yet</text>
<rect x="92" y="194" width="260" height="42" rx="21" fill="#67D7A6"/>
<text x="222" y="223" text-anchor="middle" fill="#0B2440" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700">STATUS CHECKED · 12 SEP 2026</text>

<g filter="url(#shadow)">
  <rect x="70" y="315" width="700" height="230" rx="22" fill="#FFFFFF" stroke="#D9E2E0"/>
  <circle cx="135" cy="380" r="34" fill="#E7F6F0"/>
  <text x="135" y="392" text-anchor="middle" fill="#168D73" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">01</text>
  <text x="195" y="375" fill="#0B2440" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Intermediary services</text>
  <text x="195" y="414" fill="#168D73" font-size="21" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Section 13(8)(b), IGST Act omitted</text>
  <text x="110" y="467" fill="#304A5C" font-size="22" font-family="Segoe UI, Arial, sans-serif">The special place-of-supply rule for intermediary services was</text>
  <text x="110" y="500" fill="#304A5C" font-size="22" font-family="Segoe UI, Arial, sans-serif">removed. The general rule in Section 13(2) now applies.</text>
  <text x="110" y="532" fill="#0B2440" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Operative from 30 March 2026, on Presidential assent.</text>
</g>

<g filter="url(#shadow)">
  <rect x="830" y="315" width="700" height="230" rx="22" fill="#FFFFFF" stroke="#D9E2E0"/>
  <circle cx="895" cy="380" r="34" fill="#E7F6F0"/>
  <text x="895" y="392" text-anchor="middle" fill="#168D73" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">02</text>
  <text x="955" y="375" fill="#0B2440" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">GST appellate framework</text>
  <text x="955" y="414" fill="#168D73" font-size="21" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Section 101A(1A), CGST Act</text>
  <text x="870" y="467" fill="#304A5C" font-size="22" font-family="Segoe UI, Arial, sans-serif">Government may empower an existing authority or tribunal</text>
  <text x="870" y="500" fill="#304A5C" font-size="22" font-family="Segoe UI, Arial, sans-serif">to hear appeals under Section 101B until the NAA is constituted.</text>
  <text x="870" y="532" fill="#0B2440" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Effective 1 April 2026. Principal Bench empowered by Notification 02/2026.</text>
</g>

<g filter="url(#shadow)">
  <rect x="70" y="585" width="700" height="230" rx="22" fill="#FFFFFF" stroke="#D9E2E0"/>
  <circle cx="135" cy="650" r="34" fill="#EEF4F9"/>
  <text x="135" y="662" text-anchor="middle" fill="#2B6F9F" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">03</text>
  <text x="195" y="645" fill="#0B2440" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Post-supply discounts</text>
  <text x="195" y="684" fill="#2B6F9F" font-size="21" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Finance Act sections 153 and 154</text>
  <text x="110" y="737" fill="#304A5C" font-size="22" font-family="Segoe UI, Arial, sans-serif">The enacted amendments relax the agreement-link conditions and</text>
  <text x="110" y="770" fill="#304A5C" font-size="22" font-family="Segoe UI, Arial, sans-serif">align credit-note treatment with recipient ITC reversal.</text>
  <text x="110" y="802" fill="#8A4F58" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Not yet operative as at 12 September 2026. Do not apply the new text yet.</text>
</g>

<g filter="url(#shadow)">
  <rect x="830" y="585" width="700" height="230" rx="22" fill="#FFFFFF" stroke="#D9E2E0"/>
  <circle cx="895" cy="650" r="34" fill="#EEF4F9"/>
  <text x="895" y="662" text-anchor="middle" fill="#2B6F9F" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">04</text>
  <text x="955" y="645" fill="#0B2440" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Refund changes</text>
  <text x="955" y="684" fill="#2B6F9F" font-size="21" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Finance Act section 155</text>
  <text x="870" y="737" fill="#304A5C" font-size="22" font-family="Segoe UI, Arial, sans-serif">The law provides for provisional refund of eligible inverted-duty</text>
  <text x="870" y="770" fill="#304A5C" font-size="22" font-family="Segoe UI, Arial, sans-serif">ITC and removes the minimum export-refund threshold.</text>
  <text x="870" y="802" fill="#8A4F58" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Not yet operative as at 12 September 2026. Wait for commencement notification.</text>
</g>
</svg>